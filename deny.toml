[graph]
all-features = true

[licenses]
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"

[advisories]
yanked = "deny"
ignore = [
    # winit's Wayland window decorations shape their title through ab_glyph,
    # which parses the system's font with ttf-parser; nothing here hands it
    # a file. Gone when winit moves to a maintained parser.
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained; reached only through winit's sctk-adwaita" },
]
