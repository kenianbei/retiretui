[package]
name = "retiretui_web"
description = "RetireTui in a browser page, its plans kept in the page's own storage."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy_app = "0.19.1"
plurimus = { version = "0.7.2", default-features = false, features = ["web"] }
retiretui_engine.workspace = true
retiretui_tui.workspace = true
js-sys = "0.3.106"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = [
    "Blob",
    "BlobPropertyBag",
    "console",
    "Document",
    "File",
    "FileList",
    "HtmlAnchorElement",
    "HtmlInputElement",
    "MediaQueryList",
    "Storage",
    "Url",
    "Window",
] }

# rustc's default wasm32 features, which wasm-opt must be told it may keep.
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-Oz",
    "--enable-bulk-memory",
    "--enable-multivalue",
    "--enable-mutable-globals",
    "--enable-nontrapping-float-to-int",
    "--enable-reference-types",
    "--enable-sign-ext",
]

[lints]
workspace = true
