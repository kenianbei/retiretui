# Yearly U.S. market returns and inflation from 1871, derived from Robert J.
# Shiller's data (https://shillerdata.com, formerly
# http://www.econ.yale.edu/~shiller/data.htm): `ie_data.xls`, downloaded
# 2026-09-23, and `chapt26.xlsx`, the annual data behind "Irrational
# Exuberance". Shiller publishes both freely without a stated licence; these
# figures are derived from them with this attribution.
#
# Each row is one calendar year's nominal return, January to January:
#
# - stocks: the S&P Composite with dividends reinvested monthly - the product
#   over the year's twelve months of (next month's P + this month's D / 12) /
#   this month's P, from `ie_data.xls`.
# - bonds: the product of the year's twelve "Monthly Total Bond Returns" in
#   `ie_data.xls`, Shiller's 10-year Treasury total return built from GS10
#   yields.
# - cash: the one-year interest rate held for the year - Shiller's "One-Year
#   Interest Rate" in `chapt26.xlsx` through 2011, where that series ends, then
#   January's 1-year Treasury constant-maturity rate (FRED series GS1, Board of
#   Governors of the Federal Reserve System). Where both exist the two differ
#   by about 0.6 points a year, so 2012 is a splice rather than one series.
# - inflation: January's CPI to the next January's, from `ie_data.xls`.
#
# A file of the same shape given in its place replaces it; its years must run
# one after another.

