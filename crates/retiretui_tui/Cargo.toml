[package]
name = "retiretui_tui"
description = "The RetireTui planner's interface: a plurimus app over a projected retirement plan, for the terminal or the browser."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
exclude = ["**/snapshots"]

[features]
# The launcher that runs the planner in a terminal.
terminal = ["plurimus/crossterm", "dep:clap", "retiretui_client/native"]
# The launcher that runs the planner in a window.
desktop = [
    "dep:clap",
    "retiretui_client/native",
    "dep:bevy_a11y",
    "dep:bevy_asset",
    "dep:bevy_camera",
    "dep:bevy_core_pipeline",
    "dep:bevy_diagnostic",
    "dep:bevy_image",
    "dep:bevy_mesh",
    "dep:bevy_reflect",
    "dep:bevy_render",
    "dep:bevy_shader",
    "dep:bevy_sprite_render",
    "dep:bevy_text",
    "dep:bevy_transform",
    "dep:bevy_ui_render",
    "dep:bevy_winit",
]

[dependencies]
anyhow = "1.0.104"
bevy_a11y = { version = "0.20.0", optional = true }
bevy_app = "0.20.0"
bevy_asset = { version = "0.20.0", optional = true }
bevy_camera = { version = "0.20.0", optional = true }
bevy_color = "0.20.0"
bevy_core_pipeline = { version = "0.20.0", optional = true }
bevy_diagnostic = { version = "0.20.0", optional = true }
bevy_image = { version = "0.20.0", optional = true }
bevy_input = { version = "0.20.0", default-features = false, features = ["std"] }
bevy_window = { version = "0.20.0", default-features = false, features = ["std"] }
bevy_ecs = "0.20.0"
bevy_math = { version = "0.20.0", default-features = false }
bevy_mesh = { version = "0.20.0", optional = true }
bevy_reflect = { version = "0.20.0", optional = true }
bevy_render = { version = "0.20.0", optional = true }
bevy_shader = { version = "0.20.0", optional = true }
bevy_sprite_render = { version = "0.20.0", optional = true }
bevy_text = { version = "0.20.0", default-features = false, optional = true }
bevy_input_focus = { version = "0.20.0", default-features = false, features = ["std", "keyboard"] }
bevy_time = "0.20.0"
bevy_transform = { version = "0.20.0", optional = true }
bevy_ui = { version = "0.20.0", default-features = false }
bevy_ui_render = { version = "0.20.0", optional = true }
bevy_winit = { version = "0.20.0", features = ["x11", "wayland"], optional = true }
clap = { version = "4.6.7", features = ["derive"], optional = true }
jiff.workspace = true
nucleo-matcher = "0.3.1"
plurimus = { version = "0.9.0", default-features = false, features = ["ui", "widgets", "bevy-ui"] }
plurimus_filepicker = "0.3.0"
retiretui_client = { workspace = true, features = ["bevy"] }
retiretui_engine = { workspace = true, features = ["schemars"] }
schemars.workspace = true
serde.workspace = true
toml.workspace = true
toml_edit.workspace = true
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
web-time = "1.1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
jiff = { workspace = true, features = ["js"] }
tachyonfx = { version = "0.25.2", default-features = false, features = ["std", "wasm", "sendable"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tachyonfx = { version = "0.25.2", default-features = false, features = ["std", "std-duration", "sendable"] }

[dev-dependencies]
insta = "1.48.0"
naga = { version = "30.0.1", features = ["wgsl-in"] }
retiretui_client = { workspace = true, features = ["bevy", "testing"] }

[lints]
workspace = true
