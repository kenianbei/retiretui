[package]
name = "retiretui_tui"
description = "The RetireTui planner's interface: a plurimus app over a projected retirement plan, for the terminal or the browser."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
exclude = ["**/snapshots"]

[dependencies]
anyhow = "1.0.104"
bevy_app = "0.19.1"
bevy_input = { version = "0.19.1", default-features = false, features = ["std"] }
bevy_window = { version = "0.19.1", default-features = false, features = ["std"] }
bevy_ecs = "0.19.1"
bevy_math = { version = "0.19.1", default-features = false }
bevy_input_focus = { version = "0.19.1", default-features = false, features = ["std", "keyboard"] }
bevy_time = "0.19.1"
bevy_ui = { version = "0.19.1", default-features = false }
jiff.workspace = true
nucleo-matcher = "0.3.1"
plurimus = { version = "0.7.2", default-features = false, features = ["ui", "widgets", "bevy-ui"] }
plurimus_filepicker = "0.1.1"
retiretui_client = { workspace = true, features = ["bevy"] }
retiretui_engine = { workspace = true, features = ["schemars"] }
schemars.workspace = true
serde.workspace = true
toml.workspace = true
toml_edit = "0.25.15"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
web-time = "1.1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
jiff = { workspace = true, features = ["js"] }
tachyonfx = { version = "0.25.2", default-features = false, features = ["std", "wasm", "sendable"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tachyonfx = { version = "0.25.2", default-features = false, features = ["std", "std-duration", "sendable"] }

[dev-dependencies]
insta = "1.48.0"
retiretui_client = { workspace = true, features = ["bevy", "testing"] }

[lints]
workspace = true
