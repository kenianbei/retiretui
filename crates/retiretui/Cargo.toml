[package]
name = "retiretui"
description = "Retirement planning application for the terminal."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
exclude = ["tests", "**/snapshots"]

[dependencies]
anyhow = "1.0"
bevy_app = "0.19"
bevy_input = { version = "0.19", default-features = false, features = ["std"] }
bevy_window = { version = "0.19", default-features = false, features = ["std"] }
bevy_ecs = "0.19"
bevy_math = { version = "0.19", default-features = false }
bevy_input_focus = { version = "0.19", default-features = false, features = ["std", "keyboard"] }
bevy_time = "0.19"
bevy_ui = { version = "0.19", default-features = false }
clap = { version = "4.5", features = ["derive"] }
etcetera = "0.11"
jiff.workspace = true
nucleo-matcher = "0.3"
plurimus = { version = "0.7.1", features = ["ui", "widgets", "bevy-ui"] }
plurimus_filepicker = "0.1.0"
retiretui_engine = { workspace = true, features = ["schemars"] }
rmcp = { version = "3.4.0", features = ["server", "macros", "transport-io", "schemars"] }
schemars.workspace = true
tachyonfx = { version = "0.25", default-features = false, features = ["std", "std-duration", "sendable"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.53.1", features = ["rt"] }
toml.workspace = true
toml_edit = "0.25"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
insta = "1.43"

[lints]
workspace = true
