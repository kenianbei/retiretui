[package]
name = "retiretui"
description = "Retirement planning application for the terminal."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
exclude = ["tests"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
jiff.workspace = true
retiretui_engine = { workspace = true, features = ["schemars"] }
retiretui_client = { workspace = true, features = ["clap", "native"] }
retiretui_tui = { workspace = true, features = ["terminal"] }
rmcp = { version = "3.4.1", features = ["server", "macros", "transport-io", "schemars"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.53.1", features = ["rt"] }
toml.workspace = true

[dev-dependencies]
insta = "1.48.0"

[lints]
workspace = true
