too-many-lines-threshold = 50
too-many-arguments-threshold = 5
excessive-nesting-threshold = 5

disallowed-names = [
    "..",
    "data",
    "data1",
    "info",
    "obj",
    "result",
    "temp",
    "tmp",
    "val",
]

allow-unwrap-in-tests = true
allow-expect-in-tests = true

disallowed-methods = [
    { path = "bevy_ui::Val::Px", reason = "sizes are cells: Val::Rem a cell's height, Val::Em its width, Val::ZERO for none" },
]
