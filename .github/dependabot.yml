version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      bevy:
        patterns: ["bevy*"]
      plurimus:
        patterns: ["plurimus", "plurimus_filepicker"]
      wasm-bindgen:
        patterns: ["wasm-bindgen", "wasm-bindgen-futures", "web-sys", "js-sys"]
      toml:
        patterns: ["toml", "toml_edit"]
      cargo-patch:
        patterns: ["*"]
        update-types: [patch]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/vite"]
      vite:
        patterns: ["vite", "@vitejs/plugin-react", "vitest"]
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
