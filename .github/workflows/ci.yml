name: ci

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Fmt
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --all-features --locked

      - name: The TypeScript bindings match the Rust types
        run: git diff --exit-code crates/retiretui_wasm/bindings

      - name: Docs
        run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Engine without features
        run: cargo check -p retiretui_engine

  wasm:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          target: wasm32-unknown-unknown
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy for the browser page
        run: >
          cargo clippy -p retiretui_client -p retiretui_tui -p retiretui_web
          -p retiretui_wasm --target wasm32-unknown-unknown -- -D warnings

      - name: The client stays free of every interface's own dependencies
        run: |
          for target in x86_64-unknown-linux-gnu wasm32-unknown-unknown; do
            if cargo tree -p retiretui_client -e normal --target "$target" \
              | grep -E 'bevy|plurimus|clap|rmcp|tokio|etcetera'; then
              exit 1
            fi
          done

      - name: Each interface stays free of the others' dependencies
        run: |
          refuses() { ! cargo tree -p "$1" -e normal | grep -E "$2"; }
          refuses retiretui_cli 'bevy|plurimus|rmcp|tokio'
          refuses retiretui_mcp 'bevy|plurimus'
          refuses retiretui_tui 'crossterm|rmcp|etcetera'
          refuses retiretui_wasm 'bevy|plurimus|clap|rmcp|tokio|etcetera'

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.13.1 --locked

      - name: The bindings answer from JavaScript
        run: |
          wasm-pack build --target nodejs --dev --out-dir pkg crates/retiretui_wasm
          node crates/retiretui_wasm/smoke.mjs

      - name: The bindings type-check
        run: npx -y -p typescript@5.9.3 tsc -p crates/retiretui_wasm

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          target: wasm32-unknown-unknown
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.13.1 --locked

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the app's packages
        run: npm ci

      - name: Build the bindings for a browser
        run: npm run wasm

      - name: Format, lint and import order
        run: npm run check

      - name: Type-check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npx vite build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist
          path: web/dist

  e2e:
    needs: web
    runs-on: ubuntu-latest
    # The image's version is @playwright/test's, so its browsers are the ones the suite expects.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the app's packages
        run: npm ci

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: web/dist

      - name: Every page in Chromium, Firefox and WebKit
        run: npm run e2e
        env:
          # Firefox refuses to run as root under any other home.
          HOME: /root

      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: web/playwright-report

  msrv:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read MSRV from the workspace manifest
        id: msrv
        run: |
          version=$(cargo metadata --format-version 1 --no-deps \
            | jq -er '.packages[] | select(.name == "retiretui") | .rust_version')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check
        run: cargo check --all-features

  minimal-versions:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install nightly for the resolver
        run: rustup toolchain install nightly --profile minimal

      - name: Resolve direct dependencies at their floors
        run: cargo +nightly update -Z direct-minimal-versions

      - name: Check
        run: cargo check --all-features --locked

  markdown:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Format
        run: npx -y prettier@3.6.2 --check '**/*.md'

      - name: Lint
        run: npx -y markdownlint-cli2@0.18.1 '**/*.md'

  typos:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: crate-ci/typos@512fc24f32f44ab01972217aaaf3dc86ec234d53 # v1.50.2

  semver:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          package: retiretui_engine
          feature-group: all-features

  deny:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
