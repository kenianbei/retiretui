name: release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the tag names the workspace version
        run: |
          version=$(cargo metadata --format-version 1 --no-deps \
            | jq -er '.packages[] | select(.name == "retiretui") | .version')
          test "$GITHUB_REF_NAME" = "v$version"

      - name: Cut the release notes from the changelog
        run: |
          awk -v heading="## [${GITHUB_REF_NAME#v}]" \
            '/^## \[/ { in_section = index($0, heading) == 1; next } in_section' \
            CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notes
          path: notes.md

  build:
    needs: preflight
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm

    runs-on: ${{ matrix.runner }}
    env:
      PACKAGE: retiretui-${{ matrix.target }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false

      - name: Build
        run: cargo build --release --locked -p retiretui

      - name: Package
        run: |
          mkdir "$PACKAGE"
          cp target/release/retiretui LICENSE-MIT LICENSE-APACHE README.md "$PACKAGE/"
          tar czf "$PACKAGE.tar.gz" "$PACKAGE"
          sha256sum "$PACKAGE.tar.gz" > "$PACKAGE.tar.gz.sha256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.PACKAGE }}
          path: ${{ env.PACKAGE }}.tar.gz*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: retiretui-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: notes

      - name: Publish
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file notes.md dist/*
        env:
          GH_TOKEN: ${{ github.token }}
