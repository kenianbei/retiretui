[workspace]
resolver = "3"
members = [
    "crates/retiretui_engine",
    "crates/retiretui_client",
    "crates/retiretui_tui",
    "crates/retiretui_cli",
    "crates/retiretui_mcp",
    "crates/retiretui",
    "crates/retiretui_desktop",
    "crates/retiretui_web",
    "crates/retiretui_wasm",
]
# The browser page builds for wasm32 alone, by its own script and job.
default-members = [
    "crates/retiretui_engine",
    "crates/retiretui_client",
    "crates/retiretui_tui",
    "crates/retiretui_cli",
    "crates/retiretui_mcp",
    "crates/retiretui",
    "crates/retiretui_desktop",
    "crates/retiretui_wasm",
]

[workspace.package]
version = "0.5.0"
authors = ["Norman Kerr"]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kenianbei/retiretui"
readme = "README.md"
keywords = ["retirement", "finance", "tax", "tui", "planner"]
categories = ["command-line-utilities", "finance"]
rust-version = "1.97.1"

[workspace.dependencies]
retiretui_engine = { path = "crates/retiretui_engine", version = "0.5.0" }
retiretui_client = { path = "crates/retiretui_client", version = "0.5.0" }
retiretui_tui = { path = "crates/retiretui_tui", version = "0.5.0" }
retiretui_cli = { path = "crates/retiretui_cli", version = "0.5.0" }
retiretui_mcp = { path = "crates/retiretui_mcp", version = "0.5.0" }
jiff = "0.2.37"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
toml_edit = "0.25.15"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
needless_pass_by_value = "allow"
type_complexity = "allow"

# The desktop work builds against the local plurimus parity branch and the
# file picker over it until both are published.
[patch.crates-io]
plurimus = { path = "../plurimus" }
plurimus_core = { path = "../plurimus/crates/plurimus_core" }
plurimus_term = { path = "../plurimus/crates/plurimus_term" }
plurimus_ui = { path = "../plurimus/crates/plurimus_ui" }
plurimus_widgets = { path = "../plurimus/crates/plurimus_widgets" }
plurimus_bui = { path = "../plurimus/crates/plurimus_bui" }
plurimus_crossterm = { path = "../plurimus/crates/plurimus_crossterm" }
plurimus_web = { path = "../plurimus/crates/plurimus_web" }
plurimus_filepicker = { path = "../plurimus-filepicker" }

# A debug window, and the engine's tests, run their dependencies optimised.
[profile.dev.package."*"]
opt-level = 3
