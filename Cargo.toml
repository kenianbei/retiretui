[workspace]
resolver = "3"
members = ["crates/retiretui_engine", "crates/retiretui"]

[workspace.package]
version = "0.1.0"
authors = ["Norman Kerr"]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kenianbei/retiretui"
readme = "README.md"
keywords = ["retirement", "finance", "tax", "tui", "planner"]
categories = ["command-line-utilities", "finance"]
rust-version = "1.95"

[workspace.dependencies]
retiretui_engine = { path = "crates/retiretui_engine", version = "0.1.0" }
jiff = "0.2.37"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
needless_pass_by_value = "allow"
type_complexity = "allow"
